<!doctype html>
<html lang="et">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eclipse RP • Coming Soon</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <meta name="description" content="Eclipse RP FiveM server – Coming soon" />
</head>

<body class="min-h-screen text-white bg-black">

  <!-- Background -->
  <div class="fixed inset-0 -z-10">
    <div
      class="absolute inset-0 bg-cover bg-center"
      style="background-image: url('./bg.png');"
    ></div>

    <!-- overlay -->
    <div class="absolute inset-0 bg-black/70"></div>
  </div>

  <main class="flex min-h-screen items-center justify-center px-6">
    <div class="w-full max-w-3xl rounded-3xl bg-white/5 p-10 backdrop-blur-md ring-1 ring-white/10">

      <!-- Header -->
      <div class="mb-6 flex items-center gap-3">
        <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-white/10 font-bold">
          ECRP
        </div>
        <div>
          <h1 class="text-lg font-semibold">Eclipse RP</h1>
          <p class="text-sm text-white/70">FiveM server</p>
        </div>
      </div>

      <!-- Status -->
      <span class="inline-flex items-center gap-2 rounded-full bg-white/10 px-3 py-1 text-xs">
        <span class="h-2 w-2 rounded-full bg-green-400"></span>
        Arendus käib
      </span>

      <!-- Title -->
      <h2 class="mt-4 text-4xl font-bold">
        Coming <span class="text-indigo-400">soon...</span>
      </h2>

      <p class="mt-4 text-white/80">
        Eclipse RP leht on valmimisel. Peagi leiad siit info serveri avamise,
        reeglite ja liitumise kohta.
      </p>

      <!-- Buttons -->
      <div class="mt-8 flex flex-col gap-3 sm:flex-row">
        <a
          href="https://discord.gg/Z9Mxu72zZ6"
          target="_blank"
          class="rounded-xl bg-indigo-600 px-5 py-3 text-center font-semibold hover:bg-indigo-500 transition"
        >
          Liitu Discordiga
        </a>

        <div class="rounded-xl bg-white/10 px-5 py-3 text-center">
          Serveri IP: <span class="font-mono">coming-soon</span>
        </div>
      </div>

      <!-- Footer -->
      <div class="mt-10 text-xs text-white/60 flex justify-between">
        <span>© 2025 Eclipse RP</span>
        <span>Antud lehekülg on rahastatud jaanmangib.dev leheküljge toetuste eest!</span>
      </div>

    </div>
  </main>

</body>
</html>
